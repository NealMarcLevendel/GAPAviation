modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mts"
    mandatory=true
    versionRange="[22.6.0,)"
    ordering="AFTER"
    side="BOTH"

# Optional: plane tracker on JourneyMap's map
[[dependencies.${mod_id}]]
    modId="journeymap"
    mandatory=false
    versionRange="[1.20.1-6.0.0,)"
    ordering="NONE"
    side="CLIENT"
